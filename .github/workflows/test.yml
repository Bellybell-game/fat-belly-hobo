name: Game Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Start local server
        run: |
          nohup python3 -m http.server 8901 --directory . > /tmp/http.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8901/index.html

      - name: Run test suite
        run: |
          cd tests && python3 run_suite.py
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            tests/results/
          retention-days: 30
